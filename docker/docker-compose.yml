services:
  site:
    build: ./webserver
    ports:
      - "8083:80"
  banco:
    image: postgres:16
    environment:
      # Valor lido do arquivo .env (não versionado). Modelo em .env.example
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
