name: Deploy - Publicar imagem no Docker Hub

# Dispara em push na main — na prática, só via merge de PR,
# porque a main tem branch protection
on:
  push:
    branches:
      - main

jobs:
  publicar:
    runs-on: ubuntu-latest   # runner temporário, destruído ao final do job
    steps:
      # Passo 1: baixar o código da main para o runner
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      # Passo 2: login no Docker Hub com os secrets do repositório
      # (docker/login-action executa o "docker login" usando usuário e token)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Passo 3: build da imagem (mesmo comando do workflow de testes)
      # o prefixo com o usuário do Docker Hub define em qual repositório publicar
      - name: Buildar a imagem
        run: |
          cd cicd/projeto-agendamento/app
          docker build -t diogojdiasit/agendamento-barbearia:latest .

      # Passo 4: publicar a imagem no Docker Hub
      - name: Publicar a imagem no Docker Hub
        run: docker push diogojdiasit/agendamento-barbearia:latest
