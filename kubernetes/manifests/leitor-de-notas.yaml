apiVersion: v1

# Tipo do objeto: um pod simples, outro pod, diferente do anterior
kind: Pod

metadata:
  # Nome diferente do pod anterior, de propósito: é um pod NOVO
  name: leitor-de-notas

spec:
  # Fonte do disco (mesmo pedido usado pelo gravador)
  volumes:
    - name: disco-do-pod
      persistentVolumeClaim:
        # O MESMO nome de pedido usado pelo gravador.
        # O pod é outro, mas o pedido é o mesmo, então o disco é o mesmo.
        claimName: pedido-disco-dados

  containers:
    - name: leitor
      image: busybox:1.36

      # Este pod NÃO escreve nada: só fica vivo.
      # Assim a nota antiga não é sobrescrita e a prova vale.
      command: ["sh", "-c", "sleep 3600"]

      volumeMounts:
        - name: disco-do-pod
          # Mesma pasta de antes, só para ficar fácil comparar
          mountPath: /dados
