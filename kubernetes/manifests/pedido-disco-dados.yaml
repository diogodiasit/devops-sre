# Versão da API do Kubernetes para este tipo de objeto
apiVersion: v1

# Tipo do objeto: o PEDIDO de disco (PVC)
kind: PersistentVolumeClaim

metadata:
  # Nome do pedido. É ESTE nome que o pod vai usar depois.
  # Depois de criado, não pode ser mudado.
  name: pedido-disco-dados

spec:
  # Qual setor de compras atende o pedido (tipo do disco).
  # É o "standard" que vimos no comando anterior.
  storageClassName: standard

  # Quem pode usar o disco.
  # ReadWriteOnce = um node por vez, lendo e escrevendo (igual ao Azure Disk)
  accessModes:
    - ReadWriteOnce

  # O tamanho que eu quero
  resources:
    requests:
      # 1Gi = 1 gibibyte, o "1 GB" do Kubernetes
      storage: 1Gi
