# ============================================================
# O GERENTE (HPA)
# ============================================================
apiVersion: autoscaling/v2           # versão atual do HPA (a v1 antiga só sabe medir CPU)
kind: HorizontalPodAutoscaler
metadata:
  name: escalador-catalogo
spec:
  # QUEM o gerente vai controlar: os caixas do Deployment "api-catalogo"
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-catalogo

  # MÍNIMO e MÁXIMO de caixas (pods)
  minReplicas: 2                     # nunca menos que 2: se um cair, o outro segura
  maxReplicas: 8                     # nunca mais que 8: protege o custo e o cluster

  # COM BASE EM QUÊ ele decide: a META de esforço
  metrics:
    - type: Resource                 # métrica de recurso do container (CPU ou memória)
      resource:
        name: cpu                    # olhar a força (CPU)
        target:
          type: Utilization          # medir em % da reserva (requests)
          averageUtilization: 50     # meta: cada caixa trabalhando em média a 50%
                                     # da reserva (aqui, 100m de 200m)

  # COMO ele se comporta: a ESPERA antes de fechar caixas
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # espera 5 min de calma antes de remover pods
                                       # (300 já é o padrão; deixamos explícito para aprender)
